template: |
  # Instructions:
  You are a STIX 2.1 threat intelligence analyst. Every candidate below is a INFRASTRUCTURE
  candidate: one endpoint is an infrastructure entity (a platform, channel, protocol, service, device or OS). Decide each one independently against the report_text.

  Return a relationship only if the text supports it. About one in five of candidates in this
  group are supported, so omit is the default, but do not over-prune: a missed relationship
  costs as much as a spurious one. Prefer precision on peer/sibling and speculative wording.

  relationship_type MUST come from that candidate's candidate_labels. In this group the only
  possible labels are: compromises, targets, uses.
  A flipped source/target is a separate candidate — never copy a label onto it.

  Put short decisions in chain_of_thought as one short string for the whole list
  (id:rule decision; ...). Each relationship object MUST include relation_id, source,
  target, relationship_type, and justification ("<quote> - <note>").

  ## Allowed type triples in this group (14; nothing outside this list is valid)

      attack-pattern   -> infrastructure       uses
      campaign         -> infrastructure       compromises
      campaign         -> infrastructure       targets [CRITICAL]
      campaign         -> infrastructure       uses
      infrastructure   -> infrastructure       uses
      intrusion-set    -> infrastructure       compromises
      intrusion-set    -> infrastructure       uses
      malware          -> infrastructure       targets [CRITICAL]
      malware          -> infrastructure       uses
      threat-actor     -> infrastructure       compromises
      threat-actor     -> infrastructure       targets [CRITICAL]
      threat-actor     -> infrastructure       uses
      tool             -> infrastructure       targets [CRITICAL]
      tool             -> infrastructure       uses

  ## Priority
  Relationships marked [CRITICAL] above are the highest-value output of this pipeline. Every
  one of them carries the label targets: the target is the VICTIM or the OBJECT OF THE ATTACK
  — an organisation, a sector, a region, a vulnerability, or a device/system being attacked.
  Do not fall back on uses for these. If the sentence describes attacking, scanning, probing
  or victimising the target rather than employing it as a resource, the label is targets.

  ## Label choice comes first in this group

  I1. compromises when the source obtains access to, exploits, gains a foothold on, or takes
      control of the target. Typical of an actor or intrusion-set against a device,
      controller or operating system. Prefer compromises over uses whenever access or
      exploitation language is present.
  I2. targets - CRITICAL in this group. Use it when the infrastructure is the VICTIM or the
      OBJECT of an attack, scan or probe: built to attack it, designed against it, interacts
      with and scans it, enumerates it. An entity aimed AT a device, controller, protocol
      stack or operating system takes targets, not uses.
  I3. uses when the source EMPLOYS the target as a resource: a channel, protocol, service,
      platform or hosting location that carries the operation.
      The discriminator between I2 and I3 is whether the target serves the source or suffers
      it. Do not default to uses.

  ## Aggregates and siblings

  I4. AN AGGREGATE ENTITY USES EACH CONCRETE SERVICE BENEATH IT.
      Some infrastructure entities denote a FUNCTION rather than a product — their name
      describes the role (command-and-control, staging, exfiltration) rather than a vendor.
      Such an aggregate uses every concrete named service the report places under that role,
      each as its own relationship, including the secondary and fallback ones. This fan-out
      is expected. The reverse, concrete service -> aggregate, is a different candidate and
      is omitted.
  I5. OPERATORS ALSO USE THE SERVICES.
      A malware, tool or actor that operates through one of those services uses it directly.
      A service described as a backup or fallback for a named implant still yields
      implant -> service.
  I6. PEERS DO NOT USE EACH OTHER.
      Two services presented as alternatives under the same role - a primary and a backup,
      two hosting providers, two transports - are peers, not employer and employed. Emit
      neither direction between them unless a separate sentence says one operates through,
      routes over, or depends on the other.
      Sibling channels (PlatformA -> PlatformB under the same role) omit both ways.
      Parent hub -> child channel may be uses under I4; child -> parent and sibling -> sibling
      omit. This rule applies ONLY between two peer services. It never blocks I4 or I5.

  ## Closure and paired entities

  I7. PRODUCT-FAMILY CLOSURE.
      When one sentence states which protocols, interfaces or transports a product family is
      reached over, and another sentence enumerates the concrete models of that family, emit
      model -> protocol uses for EVERY listed model against EVERY listed protocol, including
      models named only once. Direction is always the device employing the protocol. A device
      and a protocol are not peers, so I6 does not apply.
  I8. HOSTED-IDENTIFIER PAIRS ARE BIDIRECTIONAL.
      When one entity is an identifier that can only exist on the other - an address, account
      or workspace ID on a platform - emit BOTH directions with uses.

  I9. HUB INFLATION. Outside I4, I5 and I7, ask before including: would this same sentence
      equally justify swapping the target for another entity from the same paragraph
      (another platform, protocol, or peer service)? If yes, it is co-occurrence, not
      evidence. Omit.
  I10. SPECULATIVE ONLY. Omit wording that is only potential or hypothetical
      ("potentially affects", "could be used", "may target") with no observed employment
      or attack against THAT infrastructure.

  # Few-shot examples

  ## 1) Label choice, aggregate reach, peers, closure
  Input:
  {
    "report_text": "SILVER CORMORANT is able to gain a foothold on Siemens S7-1200 controllers and on Linux hosts. Its scanner module interacts with and enumerates MQTT brokers. The toolkit reaches controllers over S7comm, EtherNet/IP and MQTT; supported units include the S7-1200 and the Allen-Bradley MicroLogix 1400. Grafana Cloud serves as the primary command channel and Pusher is a fallback; HOLLOWJAW reaches its operator over both.",
    "candidate_relationships": [
      {"relation_id": "ex1a", "source": "SILVER CORMORANT", "source_type": "intrusion-set", "target": "Siemens S7-1200", "target_type": "infrastructure", "candidate_labels": ["compromises", "uses"]},
      {"relation_id": "ex1b", "source": "SILVER CORMORANT", "source_type": "intrusion-set", "target": "MQTT", "target_type": "infrastructure", "candidate_labels": ["targets", "uses", "compromises"]},
      {"relation_id": "ex1c", "source": "Siemens S7-1200", "source_type": "infrastructure", "target": "EtherNet/IP", "target_type": "infrastructure", "candidate_labels": ["uses"]},
      {"relation_id": "ex1d", "source": "Allen-Bradley MicroLogix 1400", "source_type": "infrastructure", "target": "S7comm", "target_type": "infrastructure", "candidate_labels": ["uses"]},
      {"relation_id": "ex1e", "source": "EtherNet/IP", "source_type": "infrastructure", "target": "Siemens S7-1200", "target_type": "infrastructure", "candidate_labels": ["uses"]},
      {"relation_id": "ex1f", "source": "Command channel", "source_type": "infrastructure", "target": "Pusher", "target_type": "infrastructure", "candidate_labels": ["uses"]},
      {"relation_id": "ex1g", "source": "HOLLOWJAW", "source_type": "malware", "target": "Pusher", "target_type": "infrastructure", "candidate_labels": ["targets", "uses"]},
      {"relation_id": "ex1h", "source": "Grafana Cloud", "source_type": "infrastructure", "target": "Pusher", "target_type": "infrastructure", "candidate_labels": ["uses"]},
      {"relation_id": "ex1i", "source": "Grafana Cloud", "source_type": "infrastructure", "target": "Command channel", "target_type": "infrastructure", "candidate_labels": ["uses"]}
    ]
  }
  Output:
  {
    "chain_of_thought": "ex1a:I1 compromises; ex1b:I2 targets; ex1c,ex1d:I7 uses; ex1e:omit reverse; ex1f:I4 uses; ex1g:I5 uses; ex1h:I6 omit; ex1i:omit reverse",
    "relationships": [
      {"relation_id": "ex1a", "source": "SILVER CORMORANT", "target": "Siemens S7-1200", "relationship_type": "compromises", "justification": "\"gain a foothold on Siemens S7-1200\" - compromises preferred (I1)"},
      {"relation_id": "ex1b", "source": "SILVER CORMORANT", "target": "MQTT", "relationship_type": "targets", "justification": "\"interacts with and enumerates MQTT brokers\" - device/protocol is attack object (I2)"},
      {"relation_id": "ex1c", "source": "Siemens S7-1200", "target": "EtherNet/IP", "relationship_type": "uses", "justification": "\"reaches controllers over ... EtherNet/IP\" + S7-1200 in family - device employs protocol (I7)"},
      {"relation_id": "ex1d", "source": "Allen-Bradley MicroLogix 1400", "target": "S7comm", "relationship_type": "uses", "justification": "\"reaches controllers over S7comm\" + MicroLogix in family - device employs protocol (I7)"},
      {"relation_id": "ex1f", "source": "Command channel", "target": "Pusher", "relationship_type": "uses", "justification": "\"Pusher is a fallback\" under command channel - aggregate uses concrete service (I4)"},
      {"relation_id": "ex1g", "source": "HOLLOWJAW", "target": "Pusher", "relationship_type": "uses", "justification": "\"HOLLOWJAW reaches its operator over both\" - implant uses fallback service (I5)"}
    ]
  }

  # Output:
  {{
    "chain_of_thought": "<one short string: id:rule decision; ...>",
    "relationships": [{{"relation_id": "...", "source": "...", "target": "...",
    "relationship_type": "...", "justification": "<quote> - <note>"}}]
  }}

  # Input (formatted as JSON data):
